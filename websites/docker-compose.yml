services:
  nginx-websites:
    image: nginx:alpine
    container_name: nginx-websites
    restart: unless-stopped
    ports:
      - '8081:80'
    volumes:
      - ./static-files:/usr/share/nginx/html:ro
      - ./nginx.conf/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mystack-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mystack-network:
    external: true